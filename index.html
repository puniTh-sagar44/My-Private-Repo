<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <audio id="music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div id="question-page" class="container">
        <h1>Will you be my valentine, TANU? ❤️</h1>
        <p class="instruction">(The "No" button is funny, don't click it! 😉)</p>
        
        <div class="btn-group">
            <button id="yesBtn">YES😍</button>
            <button id="noBtn">No😏</button>
        </div>
    </div>

    <div id="celebration" class="container hidden">
        <h1 class="glow-text">I love you my love! 💖</h1>
        
        <div class="video-container">
            <video id="myVideo" width="100%" height="auto" playsinline>
                <source src="video.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <div class="footer-text">
            You are my today, tomorrow, and forever.
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
