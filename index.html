<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6th Anniversary 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:radial-gradient(circle,#ff758c,#ff7eb3);
font-family:'Poppins';
overflow:hidden;
}

.glass{
width:420px;
padding:40px;
border-radius:25px;
background:rgba(255,255,255,.18);
backdrop-filter:blur(20px);
text-align:center;
color:white;
position:relative;
}

.anniversary{
font-family:'Cinzel';
font-size:28px;
margin-bottom:10px;
transition:opacity 1s;
}

.handwriting{
font-family:'Dancing Script';
font-size:32px;
white-space:pre-line;
}

.subtitle{
margin-top:10px;
font-size:14px;
opacity:0.85;
transition:opacity 1s;
}

.buttons{
position:relative;
height:120px;
margin-top:20px;
}

button{
position:absolute;
padding:12px 24px;
border:none;
border-radius:40px;
background:#ff4e50;
color:white;
cursor:pointer;
}

#yesBtn{left:60px;top:40px;}
#noBtn{right:60px;top:40px;}

video{
width:100%;
border-radius:15px;
margin-top:15px;
display:block;
}

.shake{animation:shake .3s;}
@keyframes shake{
25%{transform:translateX(-8px);}
50%{transform:translateX(8px);}
75%{transform:translateX(-6px);}
}

.fade-out{opacity:0;}
</style>
</head>
<body>

<div class="glass" id="page">

<div class="handwriting">Hey Bangaru 💖</div>
<div class="anniversary">Will You Marry Me, Sweetheart?</div>
<p>The NOPE button is funny 😜</p>

<div class="buttons">
<button id="yesBtn">Definitely 💍</button>
<button id="noBtn">NOPE 😏</button>
</div>

</div>

<audio id="oops" src="oops.mp3"></audio>

<script>
const page=document.getElementById("page");
const noBtn=document.getElementById("noBtn");
const yesBtn=document.getElementById("yesBtn");
const oops=document.getElementById("oops");

/* feedback */
function feedback(){
oops.currentTime=0;
oops.play();

page.classList.add("shake");
setTimeout(()=>page.classList.remove("shake"),300);

if(navigator.vibrate) navigator.vibrate(80);
}

/* move safely */
function move(btn){
const rect=page.getBoundingClientRect();
const maxX=rect.width-btn.offsetWidth-10;
const maxY=rect.height-btn.offsetHeight-10;

btn.style.left=Math.random()*maxX+"px";
btn.style.top=Math.random()*maxY+"px";
}

/* NOPE button */
let clicks=0;
noBtn.onclick=()=>{
feedback();
clicks++;

noBtn.style.position="absolute";
move(noBtn);

let scale=1-(clicks*0.08);
if(scale<0.3) scale=0.3;
noBtn.style.transform=`scale(${scale})`;

if(clicks>=10) noBtn.style.display="none";
};

/* YES */
yesBtn.onclick=()=>anniversary();

/* ANNIVERSARY */
function anniversary(){

page.innerHTML=`
<div class="anniversary" id="date">6th May 2026</div>
<div class="subtitle" id="suspense">
Something beautiful is about to unfold...
</div>
`;

/* fade suspense before transition */
setTimeout(()=>{
document.getElementById("suspense").classList.add("fade-out");
},3500);

/* change to anniversary */
setTimeout(()=>{
const el=document.getElementById("date");
el.classList.add("fade-out");

setTimeout(()=>{
el.innerHTML="6th Love Anniversary 💞";
el.classList.remove("fade-out");
},1000);

},4000);

/* next screen */
setTimeout(()=>{
page.innerHTML=`
<div class="anniversary">HAPPY 6TH LOVE ANNIVERSARY 💞</div>
<p>Wanna Time Travel?</p>
<div class="buttons">
<button id="yes2">YES</button>
<button id="no2">NO</button>
</div>
`;

setTimeout(()=>{
const btn=document.getElementById("no2");
let c=0;

btn.onclick=()=>{
feedback();
c++;
btn.style.position="absolute";
move(btn);

let s=1-(c*0.08);
if(s<0.3)s=0.3;
btn.style.transform=`scale(${s})`;

if(c>=10) btn.style.display="none";
};

document.getElementById("yes2").onclick=()=>showYear(2021);

},100);

},10000);
}

/* YEAR TEXT FIXED */
const textsMap={
2021:"Let’s move to 2021-2022 💫",
2022:"Now entering 2022-2023 ❤️",
2023:"Stepping into 2023-2024 👣",
2024:"Moving ahead to 2024-2025 💞",
2025:"Next stop 2025-2026 🫂",
2026:"Our journey continues..."
};

/* YEARS */
function showYear(year){

if(year>2026){ending();return;}

let title=year===2026?"2026":(year-1)+"-"+year;
let text=textsMap[year];

page.innerHTML=`
<div class="anniversary">${title}</div>
<video autoplay controls>
<source src="${year}.mp4">
</video>
<p>${text}</p>
<button onclick="showYear(${year+1})">NEXT ➜</button>
`;
}

/* typing */
function type(text,el){
let i=0;
el.innerHTML="";
function t(){
if(i<text.length){
el.innerHTML+=text[i++];
setTimeout(t,40);
}
}
t();
}

/* FINAL */
function ending(){
page.innerHTML=`<div class="handwriting" id="final"></div>`;
setTimeout(()=>{
type(
"This isn't gonna end until we are alive.\n\nLet's be together in every phase of life.\n\nI Love You Alot Mommy and I'll love you till I'm alive.",
document.getElementById("final")
);
},300);
}
</script>

</body>
</html>
