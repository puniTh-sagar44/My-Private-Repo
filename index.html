<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6th Anniversary 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:radial-gradient(circle at top,#ff758c,#ff7eb3);
font-family:'Poppins',sans-serif;
overflow:hidden;
}

.glass{
width:92%;
max-width:520px;
padding:45px 30px;
border-radius:30px;
background:rgba(255,255,255,0.18);
backdrop-filter:blur(25px);
box-shadow:0 15px 40px rgba(0,0,0,0.25);
text-align:center;
color:white;
position:relative;
transition:.6s ease;
opacity:1;
transform:scale(1);
}
.hide{opacity:0;transform:scale(.92);}

.anniversary{
font-family:'Cinzel',serif;
font-size:30px;
letter-spacing:2px;
margin-bottom:15px;
}

.handwriting{
font-family:'Dancing Script',cursive;
font-size:38px;
margin-bottom:10px;
}

.subtitle{margin-bottom:20px;opacity:.95;}

.buttons{
display:flex;
justify-content:center;
align-items:center;
gap:20px;
margin-top:20px;
position:relative;
height:60px;
}

button{
padding:12px 28px;
border:none;
border-radius:50px;
font-size:16px;
cursor:pointer;
color:white;
background:linear-gradient(145deg,#ff4e50,#ff758c);
box-shadow:0 8px 0 #c93c5c;
transition:.2s;
}
button:active{box-shadow:0 3px 0 #c93c5c;transform:translateY(5px);}

video{width:100%;border-radius:18px;margin:15px 0;}

.shake{animation:shake .4s;}
@keyframes shake{
25%{transform:translateX(-10px);}
50%{transform:translateX(10px);}
75%{transform:translateX(-8px);}
}

canvas{position:fixed;top:0;left:0;pointer-events:none;}
</style>
</head>
<body>

<canvas id="fireworks"></canvas>

<div class="glass" id="page">

<div class="handwriting">Hey Bangaru 💖</div>
<div class="anniversary">Will You Marry Me, My Sweetheart?</div>
<div class="subtitle">The NOPE button is funny 😜</div>

<div class="buttons">
<button id="yesBtn">Definitely 💍</button>
<button id="noBtn">NOPE 😏</button>
</div>

</div>

<audio id="oops" src="oops.mp3"></audio>

<script>
const page=document.getElementById("page");
const noBtn=document.getElementById("noBtn");
const yesBtn=document.getElementById("yesBtn");
const oops=document.getElementById("oops");

function changeScene(html){
page.classList.add("hide");
setTimeout(()=>{page.innerHTML=html;page.classList.remove("hide");},500);
}

/* FIRST PAGE NO BUTTON */
let scale=1,floating=false;
noBtn.onclick=()=>{
oops.play();
page.classList.add("shake");
setTimeout(()=>page.classList.remove("shake"),400);

if(!floating){noBtn.style.position="absolute";floating=true;}

scale-=0.04;
noBtn.style.transform=`scale(${scale})`;

let r=page.getBoundingClientRect();
noBtn.style.left=Math.random()*(r.width-120)+"px";
noBtn.style.top=Math.random()*(r.height-120)+"px";

if(scale<=0.18)noBtn.style.display="none";
};

/* YES CLICK */
yesBtn.onclick=()=>{multiFireworks();setTimeout(()=>anniversary(),1200);};

/* ANNIVERSARY PAGE */
function anniversary(){
changeScene(`
<div class="anniversary">HAPPY 6TH LOVE ANNIVERSARY MY HEARTBEAT 💞</div>
<div class="subtitle">Wanna Time Travel?</div>
<div class="buttons">
<button onclick="showYear(2021)">YES</button>
<button id="noBtn2">NO</button>
</div>
`);
setTimeout(setNo2,600);
}

function setNo2(){
let btn=document.getElementById("noBtn2");
let s=1,f=false;
btn.onclick=()=>{
oops.play();
page.classList.add("shake");
setTimeout(()=>page.classList.remove("shake"),400);

if(!f){btn.style.position="absolute";f=true;}

s-=0.03; /* slower shrink FIX */
btn.style.transform=`scale(${s})`;

let r=page.getBoundingClientRect();
btn.style.left=Math.random()*(r.width-120)+"px";
btn.style.top=Math.random()*(r.height-120)+"px";

if(s<=0.15)btn.style.display="none";
};
}

/* YEARS */
function showYear(year){

if(year>2026){ending();return;}

let next=year+1;
let previous=year-1;
let title = year===2026 ? "2026" : `${previous}-${year}`;

changeScene(`
<div class="anniversary">${title} 💫</div>
<video autoplay controls>
<source src="${year}.mp4" type="video/mp4">
</video>
${year<2026 ?
`<div class="subtitle">Wanna come to ${year}-${next}?</div>
<div class="buttons"><button onclick="showYear(${next})">YES</button></div>`
:
`<div class="subtitle">This is the end??</div>
<div class="buttons">
<button onclick="ending()">Definitely NOT</button>
<button onclick="ending()">Not this time</button>
</div>`
}
`);
}

/* FINAL */
function ending(){
multiFireworks();
setTimeout(()=>{
changeScene(`
<div class="handwriting">
This isn't gonna end until we are alive.<br><br>
Let's be together in every phase of life.<br><br>
I Love You Alot Mommy and I'll love you till I'm alive.
</div>
`);
},800);
}

/* FIREWORKS */
const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
let particles=[];

function burst(x,y){
for(let i=0;i<80;i++){
particles.push({x,y,angle:Math.random()*2*Math.PI,speed:Math.random()*5+2,alpha:1,color:`hsl(${Math.random()*360},100%,60%)`});
}
}
function multiFireworks(){
for(let i=0;i<5;i++){
setTimeout(()=>{burst(Math.random()*canvas.width,Math.random()*canvas.height);animate();},i*300);
}
}
function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height);
particles.forEach((p,i)=>{
p.x+=Math.cos(p.angle)*p.speed;
p.y+=Math.sin(p.angle)*p.speed;
p.alpha-=0.02;
ctx.globalAlpha=p.alpha;
ctx.beginPath();
ctx.arc(p.x,p.y,3,0,Math.PI*2);
ctx.fillStyle=p.color;
ctx.fill();
if(p.alpha<=0)particles.splice(i,1);
});
ctx.globalAlpha=1;
if(particles.length>0)requestAnimationFrame(animate);
}
</script>
</body>
</html>
