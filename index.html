<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6th Anniversary 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:radial-gradient(circle,#ff758c,#ff7eb3);
font-family:'Poppins';
overflow:hidden;
}

.glass{
width:95%;
max-width:520px;
padding:40px;
border-radius:25px;
background:rgba(255,255,255,.18);
backdrop-filter:blur(20px);
text-align:center;
color:white;
position:relative;
display:flex;
flex-direction:column;
align-items:center;
}

.anniversary{
font-family:'Cinzel';
font-size:28px;
margin-bottom:15px;
}

.handwriting{
font-family:'Dancing Script';
font-size:32px;
white-space:pre-line;
}

.buttons{
display:flex;
justify-content:center;
gap:20px;
margin-top:20px;
width:100%;
}

button{
padding:12px 24px;
border:none;
border-radius:40px;
background:#ff4e50;
color:white;
cursor:pointer;
}

video{
width:100%;
border-radius:15px;
margin-top:15px;
display:block;
}

.fade-out{opacity:0;transition:opacity 1s;}
</style>
</head>
<body>

<div class="glass" id="page">

<div class="handwriting">Hey Bangaru 💖</div>
<div class="anniversary">Will You Marry Me, My Sweetheart?</div>
<p>The NOPE button is funny 😜</p>

<div class="buttons">
<button id="yesBtn">Definitely 💍</button>
<button id="noBtn">NOPE 😏</button>
</div>

</div>

<audio id="oops" src="oops.mp3"></audio>

<script>
const page=document.getElementById("page");
const noBtn=document.getElementById("noBtn");
const yesBtn=document.getElementById("yesBtn");
const oops=document.getElementById("oops");

/* SAFE MOVE */
function move(btn){
const rect=page.getBoundingClientRect();

const maxX=rect.width-btn.offsetWidth-10;
const maxY=rect.height-btn.offsetHeight-10;

btn.style.left=Math.random()*maxX+"px";
btn.style.top=Math.random()*maxY+"px";
}

/* NO BUTTON */
let clicks=0;
noBtn.onclick=()=>{
oops.currentTime=0;
oops.play();

clicks++;

noBtn.style.position="absolute";
move(noBtn);

let scale=1-(clicks*0.08);
if(scale<0.3) scale=0.3;
noBtn.style.transform=`scale(${scale})`;

if(clicks>=10) noBtn.style.display="none";
};

/* YES */
yesBtn.onclick=()=>anniversary();

/* ANNIVERSARY */
function anniversary(){

page.innerHTML=`
<div class="anniversary" id="date">6th May 2026</div>
`;

setTimeout(()=>{
const el=document.getElementById("date");
el.classList.add("fade-out");

setTimeout(()=>{
el.innerHTML="6th Love Anniversary 💞";
el.classList.remove("fade-out");
},1000);

},4000);

setTimeout(()=>{
page.innerHTML=`
<div class="anniversary">HAPPY 6TH LOVE ANNIVERSARY 💞</div>
<button onclick="showYear(2021)">Start Journey</button>
`;
},10000);
}

/* YEARS */
const texts=[
"Let’s step into 2021-2022 💫",
"Our story continues ❤️",
"More memories await",
"Another year together",
"Still growing stronger",
"Forever continues"
];

let i=0;

function showYear(year){

if(year>2026){ending();return;}

let title=year===2026?"2026":(year-1)+"-"+year;
let text=texts[i++]||"Continue";

page.innerHTML=`
<div class="anniversary">${title}</div>
<video autoplay controls>
<source src="${year}.mp4">
</video>
<p>${text}</p>
<button onclick="showYear(${year+1})">Next ➜</button>
`;
}

/* TYPE EFFECT FIXED */
function typeEffect(text,el){
let i=0;
el.innerHTML="";
function typing(){
if(i<text.length){
el.innerHTML+=text[i];
i++;
setTimeout(typing,40);
}
}
typing();
}

/* FINAL */
function ending(){

page.innerHTML=`<div class="handwriting" id="final"></div>`;

setTimeout(()=>{
const el=document.getElementById("final");
typeEffect(
"This isn't gonna end until we are alive.\n\nLet's be together in every phase of life.\n\nI Love You Alot Mommy and I'll love you till I'm alive.",
el
);
},300);
}
</script>

</body>
</html>
