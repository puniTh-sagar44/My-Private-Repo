<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6th Anniversary 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:radial-gradient(circle at top,#ff758c,#ff7eb3);
font-family:'Poppins',sans-serif;
overflow:hidden;
}

.glass{
width:92%;
max-width:520px;
padding:45px 30px;
border-radius:30px;
background:rgba(255,255,255,0.18);
backdrop-filter:blur(25px);
box-shadow:0 15px 40px rgba(0,0,0,0.25);
text-align:center;
color:white;
position:relative;
transition:.6s ease;
}

.hide{opacity:0;transform:scale(.92);}

.anniversary{
font-family:'Cinzel',serif;
font-size:30px;
margin-bottom:15px;
transition:opacity 1s ease;
}

.handwriting{
font-family:'Dancing Script',cursive;
font-size:34px;
line-height:1.5;
}

.subtitle{margin-bottom:20px;}

.buttons{
display:flex;
justify-content:center;
gap:20px;
margin-top:20px;
position:relative;
height:70px;
}

button{
padding:12px 28px;
border:none;
border-radius:50px;
font-size:16px;
cursor:pointer;
color:white;
background:linear-gradient(145deg,#ff4e50,#ff758c);
box-shadow:0 8px 0 #c93c5c;
}

video{width:100%;border-radius:18px;margin:15px 0;}

.fade-out{opacity:0;}
</style>
</head>
<body>

<div class="glass" id="page">

<div class="handwriting">Hey Bangaru 💖</div>
<div class="anniversary">Will You Marry Me, My Sweetheart?</div>
<div class="subtitle">The NOPE button is funny 😜</div>

<div class="buttons">
<button id="yesBtn">Definitely 💍</button>
<button id="noBtn">NOPE 😏</button>
</div>

</div>

<audio id="oops" src="oops.mp3"></audio>

<script>
const page=document.getElementById("page");
const noBtn=document.getElementById("noBtn");
const yesBtn=document.getElementById("yesBtn");
const oops=document.getElementById("oops");

/* ---------- SCENE CHANGE ---------- */
function changeScene(html){
page.classList.add("hide");
setTimeout(()=>{page.innerHTML=html;page.classList.remove("hide");},500);
}

/* ---------- NO BUTTON ---------- */
let scale=1,floating=false;
noBtn.onclick=()=>{
oops.currentTime=0;
oops.play();

if(!floating){
noBtn.style.position="absolute";
floating=true;
}

scale-=0.04;
if(scale<0.2) scale=0.2;

noBtn.style.transform=`scale(${scale})`;

let r=page.getBoundingClientRect();
noBtn.style.left=Math.random()*(r.width-noBtn.offsetWidth)+"px";
noBtn.style.top=Math.random()*(r.height-noBtn.offsetHeight)+"px";

if(scale<=0.2) noBtn.style.display="none";
};

/* ---------- YES ---------- */
yesBtn.onclick=()=>setTimeout(()=>anniversary(),1000);

/* ---------- ANNIVERSARY ---------- */
function anniversary(){

changeScene(`
<div class="anniversary" id="dateText">6th May 2026</div>
`);

setTimeout(()=>{
const el=document.getElementById("dateText");
el.classList.add("fade-out");

setTimeout(()=>{
el.innerHTML="<span>6th</span> Love Anniversary 💞";
el.classList.remove("fade-out");
},800);

},4000);

/* STAY LONGER */
setTimeout(()=>{
changeScene(`
<div class="anniversary">HAPPY 6TH LOVE ANNIVERSARY MY HEARTBEAT 💞</div>
<div class="subtitle">Wanna Time Travel?</div>
<div class="buttons">
<button onclick="showYear(2021)">YES</button>
</div>
`);
},10000);
}

/* ---------- UNIQUE TEXT ---------- */
const lines=[
"Let’s step into 2021-2022 💫",
"Another year of us ❤️",
"Memories continue in 2022-2023",
"One more chapter together",
"Still not enough… 2024 awaits",
"Our journey keeps growing"
];

let lineIndex=0;

/* ---------- YEARS ---------- */
function showYear(year){

if(year>2026){ending();return;}

let title=year===2026?"2026":`${year-1}-${year}`;
let text=lines[lineIndex++] || "Let's continue 💖";

changeScene(`
<div class="anniversary">${title} 💫</div>
<video autoplay controls>
<source src="${year}.mp4">
</video>
${year<2026 ?
`<div class="subtitle">${text}</div>
<div class="buttons">
<button onclick="showYear(${year+1})">Next ➜</button>
</div>`
:
`<div class="subtitle">This is the end??</div>
<div class="buttons">
<button onclick="ending()">Definitely NOT</button>
</div>`
}
`);
}

/* ---------- TYPING EFFECT ---------- */
function typeText(text,element,speed=40){
let i=0;
element.innerHTML="";
function type(){
if(i<text.length){
element.innerHTML+=text.charAt(i);
i++;
setTimeout(type,speed);
}
}
type();
}

/* ---------- FINAL ---------- */
function ending(){

changeScene(`<div class="handwriting" id="finalText"></div>`);

setTimeout(()=>{
typeText(
`This isn't gonna end until we are alive.\n\nLet's be together in every phase of life.\n\nI Love You Alot Mommy and I'll love you till I'm alive.`,
document.getElementById("finalText"),
35
);
},800);
}
</script>

</body>
</html>
